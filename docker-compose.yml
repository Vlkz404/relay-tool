services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whatsapp_control
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp -d whatsapp_control"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:

